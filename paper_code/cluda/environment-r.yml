# Frozen R environment for this paper's cohort build.
#
# The cohort is produced by the authors' R pipeline, and the exporter
# reads these versions back and refuses to run on a mismatch. Versions
# and builds are pinned for that reason.
#
#   conda env create -f environment-r.yml -p ./.export_assets/r-env
#
# The scripts here add .export_assets/r-env/bin to PATH when it exists,
# so creating it at that prefix needs no further configuration; any
# other prefix works if its bin directory is on PATH instead.
#
# Then, into that environment, the packages R installed from CRAN
# rather than conda. install_version pins the exact release, which
# matters because the exporter checks it:
#
#   R -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
#   R -e 'remotes::install_version("ricu", "0.5.2", repos="https://cloud.r-project.org")'
name: cluda-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.1.3=h63daf7b_11
  - r-caret=6.0_94=r41h133d619_0
  - r-dplyr=1.1.2=r41ha503ecb_0
  - r-jsonlite=1.8.5=r41h57805ef_0
  - r-openssl=2.0.6=r41habfbb5e_0
  - r-prt=0.1.5=r41h785f33e_1
  - r-readr=2.1.4=r41h38f115c_0
