[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-xgboost-lightgbm"
version = "0.1.0"
description = "Shared Optuna/LightGBM engine for missing structured baselines"
requires-python = ">=3.12"
dependencies = [
  "lightgbm>=4.7,<5",
  "numpy>=2.0,<3",
  "optuna>=4.5,<5",
  "polars>=1.32,<2",
  "pyarrow>=17,<23",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
missing-xgboost-run-lightgbm = "missing_xgboost_lightgbm.experiment:main"
missing-xgboost-run-stacking = "missing_xgboost_lightgbm.multimodal_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
